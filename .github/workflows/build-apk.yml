name: Build Radar Laboral APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "${ANDROID_HOME}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: --no-daemon :app:assembleDebug

      - name: Diagnose debug APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p diagnostics
          {
            echo "APK_PATH=$APK"
            echo "APK_SIZE_BYTES=$(stat -c%s "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo "=== PACKAGE METADATA ==="
            "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20
            echo
            echo "=== APK SIGNATURE VERIFICATION ==="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "=== ZIP/APK STRUCTURE ==="
            unzip -t "$APK" | tail -n 2
          } 2>&1 | tee diagnostics/apk-diagnostic.txt

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-apk-diagnostics
          path: diagnostics/apk-diagnostic.txt
          if-no-files-found: error
          retention-days: 14
