name: Build Radar Laboral APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: --no-daemon :app:assembleDebug

      - name: Diagnose debug APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p diagnostics
          {
            echo "APK_PATH=$APK"
            echo "APK_SIZE_BYTES=$(stat -c%s "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo "=== PACKAGE METADATA ==="
            "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20
            echo
            echo "=== APK SIGNATURE VERIFICATION ==="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "=== ZIP/APK STRUCTURE ==="
            unzip -t "$APK" | tail -n 2
          } 2>&1 | tee diagnostics/apk-diagnostic.txt

      - name: Publish APK diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-apk-diagnostics
          path: diagnostics/apk-diagnostic.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore private release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/radar-laboral-release.jks
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: gradle/gradle-build-action@v3
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/radar-laboral-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          gradle-version: "8.9"
          arguments: --no-daemon :app:assembleRelease

      - name: Publish signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain unsigned status
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: echo "Release APK not generated: configure the four signing secrets in GitHub repository settings."
