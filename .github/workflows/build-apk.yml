name: Build Radar Laboral APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # Avoid android-actions/setup-android here: its default package list requests
      # the obsolete SDK package "tools", which caused the previous run to fail.
      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarLaboral-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
